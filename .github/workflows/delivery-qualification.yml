name: Delivery deterministic host qualification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/qualify_delivery_host.py'
      - '.github/workflows/delivery-qualification.yml'
      - 'tests/test_qualify_delivery_host.py'
      - 'plugins/delivery/**'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Refuse nested or previously configured execution
        run: python3 scripts/qualify_delivery_host.py --clean-runner --check-host-only
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install pinned CLI and qualify
        shell: bash
        run: |
          set -euo pipefail
          delivery_cli_prefix="$(mktemp -d)"
          npm install --prefix "$delivery_cli_prefix" --ignore-scripts --no-audit --no-fund @openai/codex@0.163.0
          python3 scripts/qualify_delivery_host.py --clean-runner --codex "$delivery_cli_prefix/node_modules/.bin/codex" --package-root "$GITHUB_WORKSPACE"
